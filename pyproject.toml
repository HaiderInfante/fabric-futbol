[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["fabric"]

[tool.ruff.lint]
# E/F: errores básicos, I: orden de imports, B: bugbear, UP: sintaxis moderna
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
